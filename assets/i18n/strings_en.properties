# Abilities Tab Specific Keys
ability_health_title=HEALTH MASKS SYSTEM
ability_health_desc=Your HP is displayed as five masks in the top bar; taking damage causes one of them to be lost.\nAdditionally, your base attack power is 100.
ability_soul_title=ABILITIES
ability_soul_desc=Press the S key to cast a powerful magical projectile forward. This ability consumes one-third of the Soul Vessel.\nPress the D key to unleash a magical explosion above the Knight, damaging nearby enemies. This ability also consumes one-third of the Soul Vessel.
ability_char_title=SOUL SYSTEM
ability_char_desc=You have a soul reservoir in the top bar with a capacity of 99 units; by default, every successful hit generates 11 souls.\nSouls can be used to restore health or activate abilities.

# Cheats Tab Specific Keys
cheat_boss_desc=Press Ctrl+F to teleport to the Boss Room.
cheat_ghost_desc=Press Ctrl+G to enable Spectator Mode and freely explore the map.
cheat_heal_desc=Press Ctrl+H to restore one Health Mask.
cheat_soul_desc=Press Ctrl+J to completely refill the Soul Vessel.
cheat_god_desc=Press Ctrl+K to toggle God Mode.
cheat_kill_desc=Press Ctrl+L to instantly eliminate all nearby enemies.

# Zote Dialogues
zote_precept_0=Hello there, traveler! I'm Zote the Mighty.
zote_precept_1=Always win your battles.
zote_precept_2=Never let others laugh at you.
zote_precept_3=Always get enough rest.
zote_precept_4=Forget the past and move forward.
zote_precept_5=Defeat strength with greater strength.
zote_precept_6=Choose your own destiny.
zote_precept_7=Do not mourn the dead.
zote_precept_8=Travel alone whenever possible.
zote_precept_9=Keep your home clean.
zote_precept_10=Keep your weapon sharp.
zote_precept_11=Trust no one completely.
zote_precept_12=Keep your cloak dry.
zote_precept_13=Never fear anything.
zote_precept_14=Respect those stronger or wiser.
zote_precept_15=Defeat enemies with a single strike.
zote_precept_16=Never hesitate after deciding.
zote_precept_17=Believe in your own strength.
zote_precept_18=Seek truth even in darkness.
zote_precept_19=If you try, make sure you succeed.
zote_precept_20=Always speak the truth.
zote_precept_21=Stay aware of your surroundings.
zote_precept_22=Leave your nest behind.
zote_precept_23=Find your enemy's weakness.
zote_precept_24=Strike your enemy's weak point.
zote_precept_25=Protect your own weak point.
zote_precept_26=Do not trust your reflection.
zote_precept_27=Eat as much as you need.
zote_precept_28=Do not stare into darkness for too long.
zote_precept_29=Develop a strong sense of direction.
zote_precept_30=Never rely on promises.
zote_precept_31=Avoid dirt and disease.
zote_precept_32=Names hold great power.
zote_precept_33=Show no mercy to enemies.
zote_precept_34=Do not eat right before sleeping.
zote_precept_35=Always know which way is up.
zote_precept_36=Eggshells break easily.
zote_precept_37=Borrow if needed, lend with caution.
zote_precept_38=Beware mysterious forces.
zote_precept_39=Eat quickly, drink slowly.
zote_precept_40=Follow your own rules.
zote_precept_41=Learn to recognize lies.
zote_precept_42=Spend your Geo wisely.
zote_precept_43=Never forgive easily.
zote_precept_44=You cannot breathe underwater.
zote_precept_45=Everything is exactly what it is.
zote_precept_46=The world is smaller than it seems.
zote_precept_47=Create your own weapon.
zote_precept_48=Be careful with fire.
