# Abilities Tab Specific Keys
ability_health_title=SYSTÈME DE MASQUES DE SANTÉ
ability_health_desc=Vos PV sont représentés par cinq masques dans la barre supérieure ; subir des dégâts vous fait perdre l'un d'eux.\nDe plus, votre puissance d'attaque de base est de 100.
ability_soul_title=CAPACITÉS
ability_soul_desc=Appuyez sur la touche S pour lancer un puissant projectile magique vers l'avant. Cette capacité consomme un tiers de la jauge d'Âme.\nAppuyez sur la touche D pour déclencher une explosion magique au-dessus du Chevalier, infligeant des dégâts aux ennemis proches. Cette capacité consomme également un tiers de la jauge d'Âme.
ability_char_title=SYSTÈME D'ÂME
ability_char_desc=Vous disposez d'une réserve d'âme dans la barre supérieure, d'une capacité de 99 unités ; par défaut, chaque coup réussi génère 11 âmes.\nLes âmes peuvent être utilisées pour restaurer votre santé ou activer des capacités.

# Cheats Tab Specific Keys
cheat_boss_desc=Appuyez sur Ctrl+F pour vous téléporter dans la salle du Boss.
cheat_ghost_desc=Appuyez sur Ctrl+G pour activer le mode Spectateur et explorer librement la carte.
cheat_heal_desc=Appuyez sur Ctrl+H pour restaurer un masque de santé.
cheat_soul_desc=Appuyez sur Ctrl+J pour remplir complètement le Réceptacle d'Âme.
cheat_god_desc=Appuyez sur Ctrl+K pour activer ou désactiver le Mode Dieu.
cheat_kill_desc=Appuyez sur Ctrl+L pour éliminer instantanément tous les ennemis à proximité.

# Dialogues de Zote
zote_precept_0=Bonjour, voyageur ! Je suis Zote le Puissant.
zote_precept_1=Remporte toujours tes combats.
zote_precept_2=Ne laisse jamais les autres se moquer de toi.
zote_precept_3=Repose-toi suffisamment.
zote_precept_4=Oublie le passé et avance.
zote_precept_5=La force vainc la force.
zote_precept_6=Choisis ton propre destin.
zote_precept_7=Ne pleure pas les morts.
zote_precept_8=Voyage seul autant que possible.
zote_precept_9=Garde ton foyer propre.
zote_precept_10=Entretiens toujours ton arme.
zote_precept_11=Ne fais confiance à personne aveuglément.
zote_precept_12=Garde ta cape au sec.
zote_precept_13=N'aie jamais peur.
zote_precept_14=Respecte ceux qui sont plus forts ou plus sages.
zote_precept_15=Abats ton ennemi d'un seul coup.
zote_precept_16=N'hésite jamais après avoir décidé.
zote_precept_17=Crois en ta propre force.
zote_precept_18=Cherche la vérité, même dans les ténèbres.
zote_precept_19=Si tu essaies, réussis.
zote_precept_20=Dis toujours la vérité.
zote_precept_21=Reste attentif à ton environnement.
zote_precept_22=Quitte ton nid.
zote_precept_23=Trouve le point faible de ton ennemi.
zote_precept_24=Frappe le point faible de ton ennemi.
zote_precept_25=Protège ton propre point faible.
zote_precept_26=Ne fais pas confiance à ton reflet.
zote_precept_27=Mange autant que nécessaire.
zote_precept_28=Ne fixe pas les ténèbres trop longtemps.
zote_precept_29=Développe ton sens de l'orientation.
zote_precept_30=Ne compte jamais sur les promesses.
zote_precept_31=Évite la saleté et les maladies.
zote_precept_32=Les noms possèdent un grand pouvoir.
zote_precept_33=Ne montre aucune pitié à tes ennemis.
zote_precept_34=Ne mange pas juste avant de dormir.
zote_precept_35=Sache toujours où est le haut.
zote_precept_36=Les coquilles d'œuf sont fragiles.
zote_precept_37=Emprunte si nécessaire, prête avec prudence.
zote_precept_38=Méfie-toi des forces mystérieuses.
zote_precept_39=Mange vite, bois lentement.
zote_precept_40=Suis tes propres règles.
zote_precept_41=Apprends à reconnaître les mensonges.
zote_precept_42=Dépense ton Géo avec sagesse.
zote_precept_43=Ne pardonne pas trop facilement.
zote_precept_44=Tu ne peux pas respirer sous l'eau.
zote_precept_45=Chaque chose est ce qu'elle est.
zote_precept_46=Le monde est plus petit qu'il n'y paraît.
zote_precept_47=Fabrique ta propre arme.
zote_precept_48=Sois prudent avec le feu.
zote_precept_49=Les statues n'ont aucune importance.
zote_precept_50=Ne perds pas ton temps avec les mystères.
zote_precept_51=Rien n'est totalement inoffensif.
zote_precept_52=Méfie-toi de la jalousie des pères.
zote_precept_53=Ne vole pas les rêves des autres.
zote_precept_54=Garde toujours la clé de ce que tu enfermes.
zote_precept_55=Ne t'incline devant personne.
zote_precept_56=Les rêves peuvent te tromper.
zote_precept_57=Souviens-toi de tous les préceptes et respecte-les.

